experience:
  - role: Teaching Assistant (High Performance Scientific Computing)
    org: University of Massachusetts Dartmouth
    start: December 2025
    summary: |
      - Guided students in Python, C, numerical linear algebra, and parallel computing (MPI, OpenMP, CUDA), while teaching Git, Bitbucket and Jupyter-based data analysis.
      - Mentored Data Science students to develop and optimize parallel programs for achieving significant speedups (using GPUs), covering memory access, load balancing, debugging (GDB, TotalView), and performance/scalability analysis.
      - Delivered technical presentations and clearly articulated complex computational concepts to diverse student audiences.
    button:
      text: View portfolio
      url: /
      icon: hero/arrow-down-tray
  - role: Graduate Assistant (Machine Learning / AI)
    start: January 2025
    summary: |
      - Deployed Ollama LLM on a Unity HPC cluster via Docker with GPU acceleration, achieving 3–5× inference throughput improvement over CPU baselines; profiled end-to-end latency and memory footprint to identify optimization opportu- nities analogous to TensorRT-LLM deployment workflows.
      - Built and benchmarked a production-ready RAG-based LLM chatbot using HuggingFace embeddings, FAISS vector search, and REST APIs on AWS; improved response relevance by 40% through prompt engineering, retrieval scheduling, and inference pipeline optimization — directly applicable to GenAI inference serving (vLLM/SGLang patterns).
      - Developed CNN-based image classification pipeline (Xception / ImageNet transfer learning, TensorFlow/Keras) for brain tumor detection; applied INT8-equivalent quantization-aware training strategies, data augmentation, and cross- validation to optimize model size and throughput for clinical AI pipelines.
      - Built time-series regression models (ARIMA, XGBoost) to forecast COVID-19 trends from epidemiological data; reduced MSE by 30% via feature engineering and hyperparameter tuning on temporal waveform data.
  - role: Research Assistant (High-Performance Multiphase CFD Simulations)
    org: University of Massachusetts Dartmouth
    start: January 2023
    end: September 2025
    summary: |
      - Developed a C++ based fully Eulerian multiphase CFD solver for water-entry problems, incorporating Volume of Fluid (VOF) and fictitious domain methods for fluid–structure interaction (FSI).
      - Designed and parallelized the solver using MPI on Linux HPC clusters; implemented Bi-Conjugate Gradient Stabilized (BiCGStab) and multigrid methods for efficient solution of the pressure Poisson equation, achieving an 8× improvement in accuracy with residuals reduced to 10−12.
      - Optimized multi-core scalability through domain decomposition, load balancing, and communication-efficient strategies over InfiniBand interconnects; conducted strong and weak scaling analyses, resulting in a 6× performance improvement.
      - Conducted performance benchmarking and scalability analysis across core counts, comparable to roofline analysis used in GPU inference optimization.
  - role: Research Assistant (High-Performance Multiphase CFD Simulations)
    org: TU Bergakademie Freiberg (Germany)
    start: May 2021
    end: August 2022
    summary: |
      - Performed transient multiphase simulations in OpenFOAM using VOF, dynamic mesh, and Adaptive mesh (AMR).
      - Optimized solver for high density-ratio flows, gaining deep intuition for numerical stability and performance trade-offs applicable to low-latency, resource-constrained inference systems.
  - role: AI Research Intern
    org: OpenAI
